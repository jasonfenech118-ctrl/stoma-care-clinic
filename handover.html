<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Inpatients Handover</title>
<!--
  A page of its own for the ward handover. It is a thin entry point: it sends
  the browser straight to the standalone handover inside the app (index.html
  with the #handover route, which drops the top bar, tabs and page heading and
  shows only the sheet). Keeping it a redirect means there is one handover to
  maintain, not two — but it gives the ward a clean URL to bookmark or pin, and
  its own tab titled "Inpatients Handover".
-->
<script>
  // Land on the standalone handover next to this file, keeping the same origin
  // and folder so it works the same on GitHub Pages or a local copy.
  var base=location.pathname.replace(/[^/]*$/,'');
  location.replace(location.origin+base+'index.html#handover');
</script>
<style>
  html,body{height:100%;margin:0;}
  body{display:flex;align-items:center;justify-content:center;
    font-family:'Inter',Arial,Helvetica,sans-serif;background:#1a2e4a;color:#fff;}
  .h-splash{text-align:center;padding:24px;}
  .h-splash h1{font-size:18px;font-weight:800;margin:0 0 6px;}
  .h-splash p{font-size:13px;opacity:.85;margin:0 0 16px;}
  .h-splash a{color:#8ecae6;font-weight:700;}
  .h-spin{width:34px;height:34px;margin:0 auto 16px;border:3px solid rgba(255,255,255,.25);
    border-top-color:#fff;border-radius:50%;animation:h-rot .8s linear infinite;}
  @keyframes h-rot{to{transform:rotate(360deg);}}
</style>
</head>
<body>
  <div class="h-splash">
    <div class="h-spin"></div>
    <h1>Opening the Inpatients Handover…</h1>
    <p>If it does not open on its own, <a href="index.html#handover">tap here</a>.</p>
  </div>
</body>
</html>
