<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MDH Directory</title>
<style>
  :root{
    --navy:#12304f; --teal:#0d7377; --ink:#1f2937; --muted:#6b7280;
    --line:#e2e8f0; --bg:#f4f7fb; --card:#ffffff; --chip:#eef2f7;
    --ext:#0d7377; --phone:#2563eb; --pager:#b45309;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Segoe UI',Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;}
  a{color:inherit;text-decoration:none;}
  .top{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,var(--navy),var(--teal));color:#fff;
    padding:14px 16px 12px;box-shadow:0 2px 10px rgba(18,48,79,.18);}
  .top h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.2px;}
  .top .sub{font-size:12px;opacity:.85;margin-top:2px;}
  .top .backlink{float:right;font-size:12px;background:rgba(255,255,255,.16);padding:5px 10px;border-radius:999px;font-weight:600;}
  .search{margin-top:11px;position:relative;}
  .search input{width:100%;padding:12px 14px 12px 40px;border:0;border-radius:10px;font-size:16px;
    background:#fff;color:var(--ink);box-shadow:0 1px 0 rgba(0,0,0,.05);}
  .search .mag{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.55;}
  .filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;}
  .chip{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.10);color:#fff;
    padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;user-select:none;}
  .chip.on{background:#fff;color:var(--navy);border-color:#fff;}
  main{max-width:820px;margin:0 auto;padding:14px 16px 60px;}
  .count{color:var(--muted);font-size:12.5px;margin:2px 2px 10px;}
  .row{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:11px;padding:11px 13px;margin-bottom:8px;}
  .row .body{flex:1 1 auto;min-width:0;}
  .row .name{font-weight:600;line-height:1.3;word-break:break-word;}
  .row .nums{margin-top:4px;display:flex;flex-wrap:wrap;gap:6px 8px;}
  .num{display:inline-block;font-variant-numeric:tabular-nums;font-weight:700;color:var(--teal);
    background:#e7f3f2;border:1px solid #c9e6e4;border-radius:8px;padding:3px 9px;font-size:14px;}
  .num.muted{color:var(--muted);background:var(--chip);border-color:var(--line);font-weight:600;}
  .tag{flex:0 0 auto;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;
    padding:4px 8px;border-radius:7px;margin-top:2px;white-space:nowrap;}
  .tag.ext{color:var(--ext);background:#e2f1f0;}
  .tag.phone{color:var(--phone);background:#e6efff;}
  .tag.pager{color:var(--pager);background:#fdefdc;}
  .note{color:var(--muted);text-align:center;padding:36px 12px;font-size:14px;}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ink:#e6edf5; --muted:#9aa7b6; --line:#26313f; --bg:#0e141b; --card:#151d27; --chip:#1c2734;
    }
    :root:not([data-theme="light"]) .num{background:#12302e;border-color:#1c4b47;color:#4fd0c9;}
    :root:not([data-theme="light"]) .num.muted{background:#1c2734;color:#9aa7b6;border-color:#26313f;}
    :root:not([data-theme="light"]) .search input{background:#151d27;color:var(--ink);}
    :root:not([data-theme="light"]) .tag.ext{background:#12302e;}
    :root:not([data-theme="light"]) .tag.phone{background:#132239;}
    :root:not([data-theme="light"]) .tag.pager{background:#2c2313;}
  }
</style>
</head>
<body>
  <div class="top">
    <a class="backlink" href="./">‹ Clinic app</a>
    <h1>Mater Dei Hospital — Directory</h1>
    <div class="sub">Extensions, phone numbers &amp; pagers — tap a number to call</div>
    <div class="search">
      <span class="mag">🔍</span>
      <input id="q" type="search" autocomplete="off" placeholder="Search a name or a number…" aria-label="Search the directory"/>
    </div>
    <div class="filters" id="filters">
      <span class="chip on" data-type="all">All</span>
      <span class="chip" data-type="Extension">Extensions</span>
      <span class="chip" data-type="Phone number">Phone numbers</span>
      <span class="chip" data-type="Pager">Pagers</span>
    </div>
  </div>
  <main>
    <div class="count" id="count"></div>
    <div id="list"><div class="note">Loading the directory…</div></div>
  </main>
<script>
  var ROWS=[], TYPE='all';
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  // A small, correct CSV reader: honours "quoted, fields" that contain commas,
  // doubled "" quotes and stray newlines, so a value like "6701,6716" stays one field.
  function parseCSV(text){
    var rows=[], row=[], field='', inQ=false, i=0, n=text.length;
    function endField(){row.push(field);field='';}
    function endRow(){endField();rows.push(row);row=[];}
    while(i<n){
      var c=text[i];
      if(inQ){
        if(c==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inQ=false;i++;continue; }
        field+=c;i++;continue;
      }
      if(c==='"'){inQ=true;i++;continue;}
      if(c===','){endField();i++;continue;}
      if(c==='\r'){i++;continue;}
      if(c==='\n'){endRow();i++;continue;}
      field+=c;i++;
    }
    if(field.length||row.length)endRow();
    return rows;
  }

  function classForType(t){
    var s=String(t||'').toLowerCase();
    if(s.indexOf('pager')>-1)return 'pager';
    if(s.indexOf('phone')>-1)return 'phone';
    return 'ext';
  }
  function tagLabel(t){
    var s=String(t||'').toLowerCase();
    if(s.indexOf('pager')>-1)return 'Pager';
    if(s.indexOf('phone')>-1)return 'Phone';
    return 'Ext';
  }
  // Numbers can be a single value, a comma-list ("6701,6716") or shorthand
  // ("4030/1/9"). Comma-lists become separate call chips; anything else stays a
  // single chip that dials its first real number.
  function numbersHTML(value){
    var v=String(value||'').trim();
    if(!v)return '<span class="num muted">—</span>';
    var parts = v.indexOf(',')>-1 ? v.split(',') : [v];
    return parts.map(function(p){
      p=p.trim(); if(!p)return '';
      var m=p.match(/\d{3,}/);
      return m ? '<a class="num" href="tel:'+esc(m[0])+'">'+esc(p)+'</a>'
               : '<span class="num muted">'+esc(p)+'</span>';
    }).join('');
  }

  function render(){
    var q=(document.getElementById('q').value||'').trim().toLowerCase();
    var terms=q.split(/\s+/).filter(Boolean);
    var out=ROWS.filter(function(r){
      if(TYPE!=='all' && r.type!==TYPE)return false;
      if(terms.length){
        var hay=(r.name+' '+r.value).toLowerCase();
        for(var k=0;k<terms.length;k++){ if(hay.indexOf(terms[k])<0)return false; }
      }
      return true;
    });
    document.getElementById('count').textContent=
      out.length+' of '+ROWS.length+' entr'+(ROWS.length===1?'y':'ies');
    var list=document.getElementById('list');
    if(!out.length){ list.innerHTML='<div class="note">No entry matches that search.</div>'; return; }
    var html=new Array(out.length);
    for(var j=0;j<out.length;j++){
      var r=out[j], cls=classForType(r.type);
      html[j]='<div class="row"><div class="body"><div class="name">'+esc(r.name)+
        '</div><div class="nums">'+numbersHTML(r.value)+'</div></div>'+
        '<span class="tag '+cls+'">'+tagLabel(r.type)+'</span></div>';
    }
    list.innerHTML=html.join('');
  }

  function setType(t){
    TYPE=t;
    var chips=document.querySelectorAll('#filters .chip');
    for(var i=0;i<chips.length;i++)chips[i].classList.toggle('on',chips[i].getAttribute('data-type')===t);
    render();
  }

  function boot(rows){
    var seen={}, clean=[];
    for(var i=1;i<rows.length;i++){ // row 0 is the header
      var r=rows[i]; if(!r)continue;
      var type=(r[0]||'').trim(), name=(r[1]||'').trim(), value=(r[2]||'').trim();
      if(!name && !value)continue;
      var key=type+'|'+name+'|'+value;
      if(seen[key])continue; seen[key]=1;
      clean.push({type:type,name:name||'(unnamed)',value:value});
    }
    clean.sort(function(a,b){ return a.name.toLowerCase()<b.name.toLowerCase()?-1:a.name.toLowerCase()>b.name.toLowerCase()?1:0; });
    ROWS=clean;
    render();
  }

  document.getElementById('q').addEventListener('input',render);
  document.getElementById('filters').addEventListener('click',function(e){
    var chip=e.target.closest('.chip'); if(chip)setType(chip.getAttribute('data-type'));
  });

  fetch('assets/directory.csv',{cache:'no-cache'})
    .then(function(res){ if(!res.ok)throw new Error('HTTP '+res.status); return res.text(); })
    .then(function(text){ boot(parseCSV(text)); })
    .catch(function(err){
      document.getElementById('list').innerHTML=
        '<div class="note">Could not load the directory (assets/directory.csv): '+esc(err.message||err)+
        '<br/>Open this page from the published site rather than a local file.</div>';
    });
</script>
</body>
</html>
