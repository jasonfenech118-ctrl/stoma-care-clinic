    <path d="M-17-6-30-16-18 2ZM17-6 30-16 18 2Z" fill="#f6d2b8"/>
    <circle cx="-6" cy="-6" r="2.5" fill="#333"/><circle cx="6" cy="-6" r="2.5" fill="#333"/>
    <path d="M-6 4Q0 9 6 4" fill="none" stroke="#a0522d" stroke-width="2" stroke-linecap="round"/>
    <path d="M-20-12Q-8-58 30-50Q14-42 20-14Z" fill="#2e7d32"/>
    <rect x="-21" y="-17" width="42" height="7" rx="3" fill="#c62828"/>
    <circle cx="31" cy="-50" r="6" fill="#c62828"/>
  </g>

  <!-- Elf 2 (with a present) -->
  <g transform="translate(640 560)">
    <rect x="-16" y="56" width="10" height="34" fill="#fff"/><rect x="6" y="56" width="10" height="34" fill="#fff"/>
    <path d="M-16 62h10M-16 72h10M-16 82h10M6 62h10M6 72h10M6 82h10" stroke="#2e7d32" stroke-width="5"/>
    <path d="M-20 90h16v8h-22q-6 0-4-6ZM4 90h16q8 0 10 8H4Z" fill="#c62828"/>
    <path d="M-26 64L-20 14H20L26 64Z" fill="#c62828"/>
    <rect x="-24" y="34" width="48" height="7" fill="#5d4037"/>
    <circle cx="0" cy="-4" r="18" fill="#f6d2b8"/>
    <path d="M-17-6-30-16-18 2ZM17-6 30-16 18 2Z" fill="#f6d2b8"/>
    <circle cx="-6" cy="-6" r="2.5" fill="#333"/><circle cx="6" cy="-6" r="2.5" fill="#333"/>
    <path d="M-6 4Q0 9 6 4" fill="none" stroke="#a0522d" stroke-width="2" stroke-linecap="round"/>
    <path d="M20-12Q8-58-30-50Q-14-42-20-14Z" fill="#c62828"/>
    <rect x="-21" y="-17" width="42" height="7" rx="3" fill="#2e7d32"/>
    <circle cx="-31" cy="-50" r="6" fill="#fff"/>
    <rect x="-26" y="20" width="52" height="36" rx="3" fill="#1e88e5"/>
    <path d="M0 20v36M-26 38h52" stroke="#e3b341" stroke-width="5"/>
    <path d="M0 20q-12-14-16-4q6 6 16 4q12-14 16-4q-6 6-16 4Z" fill="#e3b341"/>
    <circle cx="-30" cy="34" r="6" fill="#f6d2b8"/><circle cx="30" cy="34" r="6" fill="#f6d2b8"/>
  </g>
</g>
</svg>
