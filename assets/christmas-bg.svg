    <circle cx="-9" cy="-10" r="6" fill="none" stroke="#555" stroke-width="2"/><circle cx="9" cy="-10" r="6" fill="none" stroke="#555" stroke-width="2"/>
    <path d="M-3-10H3" stroke="#555" stroke-width="2"/>
    <circle cx="-9" cy="-10" r="2" fill="#333"/><circle cx="9" cy="-10" r="2" fill="#333"/>
    <circle cx="-15" cy="0" r="4" fill="#f2a1a1"/><circle cx="15" cy="0" r="4" fill="#f2a1a1"/>
    <path d="M-7 4Q0 10 7 4" fill="none" stroke="#a0522d" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Reindeer -->
  <g transform="translate(360 470)">
    <rect x="-52" y="18" width="11" height="54" rx="4" fill="#8d5a33"/><rect x="-32" y="20" width="11" height="52" rx="4" fill="#7a4b28"/>
    <rect x="26" y="18" width="11" height="54" rx="4" fill="#8d5a33"/><rect x="44" y="20" width="11" height="52" rx="4" fill="#7a4b28"/>
    <path d="M-56 70h17v6h-17ZM-36 70h17v6h-17ZM22 70h17v6H22ZM40 70h17v6H40Z" fill="#3e2a1a"/>
    <ellipse cx="0" cy="10" rx="66" ry="32" fill="#9c6438"/>
    <ellipse cx="0" cy="22" rx="40" ry="14" fill="#c99467"/>
    <path d="M-66 0q-14-6-10 8" fill="#c99467"/>
    <path d="M40-6Q54-40 70-48L84-30Q64-20 58 6Z" fill="#9c6438"/>
    <path d="M40 2h30" stroke="#c62828" stroke-width="7"/><circle cx="54" cy="12" r="6" fill="#e3b341"/>
    <ellipse cx="84" cy="-52" rx="24" ry="17" fill="#9c6438" transform="rotate(-12 84 -52)"/>
    <circle cx="108" cy="-56" r="8" fill="#e53935"/>
    <circle cx="86" cy="-58" r="3.5" fill="#222"/>
