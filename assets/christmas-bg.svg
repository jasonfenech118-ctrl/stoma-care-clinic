<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" width="760" height="760">
<!-- Faint Christmas background tile: Father Christmas, Mother Christmas, a
     reindeer and two elves among snowflakes. The whole tile is drawn at low
     opacity so it stays behind the clinic pages without hurting legibility. -->
<defs>
  <g id="flake" fill="none" stroke="#7aa6c9" stroke-width="2" stroke-linecap="round">
    <path d="M0-10V10M-8.7-5 8.7 5M-8.7 5 8.7-5"/>
    <path d="M-3-8 0-5 3-8M-3 8 0 5 3 8"/>
  </g>
  <path id="star" d="M0-9 2.6-2.8 9.4-2.8 4-1.1 6.2 6.5 0 2.3-6.2 6.5-4-1.1-9.4-2.8-2.6-2.8Z" fill="#e3b341"/>
</defs>
<g opacity=".13">

  <!-- Snowflakes and stars scattered across the tile -->
  <use href="#flake" x="40" y="40"/><use href="#flake" x="330" y="70"/><use href="#flake" x="700" y="40"/>
  <use href="#flake" x="250" y="300"/><use href="#flake" x="690" y="300"/><use href="#flake" x="30" y="380"/>
  <use href="#flake" x="460" y="380"/><use href="#flake" x="170" y="700"/><use href="#flake" x="560" y="720"/>
  <use href="#flake" x="720" y="620"/><use href="#flake" x="380" y="610"/>
  <use href="#star" x="230" y="40"/><use href="#star" x="600" y="260"/><use href="#star" x="80" y="300"/>
  <use href="#star" x="430" y="720"/><use href="#star" x="720" y="460"/>

  <!-- Father Christmas -->
  <g transform="translate(140 150)">
    <rect x="-30" y="92" width="22" height="34" fill="#c62828"/><rect x="8" y="92" width="22" height="34" fill="#c62828"/>
    <path d="M-36 124h30v12h-34a4 4 0 0 1 4-12Z M6 124h30a4 4 0 0 1 4 12H6Z" fill="#222"/>
    <ellipse cx="-50" cy="56" rx="13" ry="30" fill="#c62828" transform="rotate(20 -50 56)"/>
    <ellipse cx="50" cy="56" rx="13" ry="30" fill="#c62828" transform="rotate(-20 50 56)"/>
    <circle cx="-60" cy="82" r="9" fill="#2e7d32"/><circle cx="60" cy="82" r="9" fill="#2e7d32"/>
    <ellipse cx="0" cy="60" rx="46" ry="50" fill="#d32f2f"/>
    <rect x="-6" y="14" width="12" height="80" fill="#fff"/>
    <rect x="-46" y="62" width="92" height="12" fill="#222"/>
    <rect x="-9" y="60" width="18" height="16" rx="2" fill="none" stroke="#e3b341" stroke-width="4"/>
    <circle cx="0" cy="-6" r="26" fill="#f6d2b8"/>
    <path d="M-28-2Q-30 44 0 54Q30 44 28-2Q14 16 0 12Q-14 16-28-2Z" fill="#fff"/>
    <path d="M-16 6Q-6 0 0 6Q6 0 16 6Q8 12 0 9Q-8 12-16 6Z" fill="#f2f2f2"/>
    <circle cx="-9" cy="-10" r="3" fill="#333"/><circle cx="9" cy="-10" r="3" fill="#333"/>
    <circle cx="0" cy="-2" r="4" fill="#e8998d"/>
    <path d="M-28-20Q-12-62 34-52Q18-40 24-22Z" fill="#d32f2f"/>
    <rect x="-30" y="-26" width="60" height="12" rx="6" fill="#fff"/>
    <circle cx="36" cy="-52" r="8" fill="#fff"/>
  </g>

  <!-- Mother Christmas -->
  <g transform="translate(560 120)">
    <path d="M-28 40L-50 140H50L28 40Z" fill="#c62828"/>
    <rect x="-52" y="132" width="104" height="12" rx="4" fill="#fff"/>
    <path d="M-16 50H16L22 124H-22Z" fill="#fff"/>
    <path d="M-16 50H16" stroke="#2e7d32" stroke-width="4"/>
    <ellipse cx="0" cy="40" rx="30" ry="26" fill="#d32f2f"/>
    <ellipse cx="-34" cy="58" rx="10" ry="26" fill="#d32f2f" transform="rotate(18 -34 58)"/>
    <ellipse cx="34" cy="58" rx="10" ry="26" fill="#d32f2f" transform="rotate(-18 34 58)"/>
    <circle cx="-42" cy="80" r="7" fill="#f6d2b8"/><circle cx="42" cy="80" r="7" fill="#f6d2b8"/>
    <rect x="-24" y="12" width="48" height="8" rx="4" fill="#fff"/>
    <circle cx="0" cy="-10" r="24" fill="#f6d2b8"/>
    <path d="M-25-8Q-28-38 0-38Q28-38 25-8Q20-26 0-27Q-20-26-25-8Z" fill="#f4f4f4"/>
