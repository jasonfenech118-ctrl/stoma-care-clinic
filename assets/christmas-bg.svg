      <path d="M90-68Q96-94 116-104M96-86 110-82M104-98 112-116"/>
    </g>
  </g>

  <!-- Elf 1 -->
  <g transform="translate(110 520)">
    <rect x="-16" y="56" width="10" height="34" fill="#fff"/><rect x="6" y="56" width="10" height="34" fill="#fff"/>
    <path d="M-16 62h10M-16 72h10M-16 82h10M6 62h10M6 72h10M6 82h10" stroke="#c62828" stroke-width="5"/>
    <path d="M-20 90h16v8h-22q-6 0-4-6ZM4 90h16q8 0 10 8H4Z" fill="#2e7d32"/>
    <path d="M-26 64L-20 14H20L26 64Z" fill="#388e3c"/>
    <path d="M-26 64l6-8 6 8 6-8 6 8 6-8 6 8 6-8 6 8" fill="#2e7d32" stroke="#e3b341" stroke-width="2"/>
    <rect x="-24" y="34" width="48" height="7" fill="#5d4037"/><rect x="-5" y="33" width="10" height="9" fill="none" stroke="#e3b341" stroke-width="2"/>
    <ellipse cx="-28" cy="30" rx="7" ry="18" fill="#388e3c" transform="rotate(25 -28 30)"/>
    <ellipse cx="28" cy="30" rx="7" ry="18" fill="#388e3c" transform="rotate(-25 28 30)"/>
