name: Recover approved communication reminder update
on:
  push:
    branches:
      - codex/communication-reminders-recovery
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a3421505c7c829a720c07b247b3e6d000a85e6d2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover and verify the approved patch
        env:
          APPROVED_PATCH_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-9754-820a-b275-fe801af33c33/raw?se=2026-10-09T16%3A26%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=01a12140-3ed2-7e27-bd3c-38347d2473df&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-09T03%3A45%3A59Z&ske=2026-10-10T03%3A45%3A59Z&sks=b&skv=2026-02-06&sig=MiuIjMBMD%2BJ3YHSin3yD8nlkUNxwWN26Z7g0NkkpJRA%3D"
        run: |
          curl --fail --silent --show-error --location --max-time 60 "$APPROVED_PATCH_URL" --output "$RUNNER_TEMP/approved.patch"
          python3 - <<'PY'
          import base64, hashlib, os, pathlib
          data = pathlib.Path(os.environ['RUNNER_TEMP'], 'approved.patch').read_bytes()
          assert len(data) == 120537, 'Saved patch length mismatch'
          assert data.startswith(b'From 2e3f0a5ea020135d397868f563a0c2e322875300 '), 'Saved commit mismatch'
          assert b'base-commit: a3421505c7c829a720c07b247b3e6d000a85e6d2' in data, 'Saved base mismatch'
          print('APPROVED_PATCH_SHA256:' + hashlib.sha256(data).hexdigest())
          encoded = base64.b64encode(data).decode('ascii')
          for start in range(0, len(encoded), 120):
              print('APPROVED_PATCH_DATA:' + encoded[start:start+120])
          print('APPROVED_PATCH_END')
          PY
          git apply --check "$RUNNER_TEMP/approved.patch"
          git apply --index "$RUNNER_TEMP/approved.patch"
          git diff --cached --stat
      - name: Install isolated test dependency
        run: npm install --prefix "$RUNNER_TEMP/reminder-test-deps" --no-audit --no-fund @electric-sql/pglite
      - name: Run workflow and database regression tests
        run: NODE_PATH="$RUNNER_TEMP/reminder-test-deps/node_modules" node --test --test-concurrency=2 tools/tests/*.test.cjs
