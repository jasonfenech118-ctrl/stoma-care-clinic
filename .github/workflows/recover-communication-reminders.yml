name: Verify published communication reminders
on:
  push:
    branches:
      - codex/communication-reminders-recovery
permissions: {}
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live build and published assets
        run: |
          python3 - <<'PY'
          import hashlib, time, urllib.request
          base = 'https://jasonfenech118-ctrl.github.io/stoma-care-clinic/'
          expected = {"index.html":"d449f0455bf56843cdbe880d79a0c125580e1810","assets/manual.js":"9a813e3e1944e30350d57d3d19e7aaa218fd5e13","assets/patient-communications.css":"3316c33b79535d4ccf876c79b9583c7261948b16","assets/patient-communications.js":"822a58c96a2892a7c2b9b7ee938cada7a783a272"}
          commit = '3ee4ada4d222a1a358894a96d6156eba417fe226'
          for attempt in range(30):
              try:
                  for path, wanted in expected.items():
                      req = urllib.request.Request(base + path + '?verify=' + commit, headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req, timeout=20) as response:
                          assert response.status == 200, 'HTTP status mismatch'
                          data = response.read()
                      actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\x00' + data).hexdigest()
                      assert actual == wanted, 'Waiting for published asset: ' + path
                      if path == 'index.html':
                          assert b'2026.10.09-490' in data, 'Published build mismatch'
                  print('LIVE_BUILD_VERIFIED:2026.10.09-490')
                  print('LIVE_ASSETS_VERIFIED:' + ', '.join(expected))
                  break
              except Exception as exc:
                  if attempt == 29:
                      raise
                  print('Deployment pending: ' + str(exc), flush=True)
                  time.sleep(5)
          PY
