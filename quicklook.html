<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Quick Look</title>
<meta name="theme-color" content="#12304f"/>
<meta name="description" content="Quick Look — fast read-only patient lookup for the MDH Stoma Care register."/>
<!-- Its own Quick Look identity, so this page can be pinned to a phone's home
     screen and shared as a link separate from the full clinic app. -->
<link rel="manifest" href="quicklook.webmanifest"/>
<link rel="apple-touch-icon" href="apple-touch-quicklook.png"/>
<link rel="icon" href="assets/ql-192.png"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Quick Look"/>
<!-- If JavaScript is off or the redirect below is slow, still go straight in. -->
<noscript><meta http-equiv="refresh" content="0;url=index.html#lookup"/></noscript>
<style>
  :root{--navy:#12304f;--indigo:#4338ca;--ink:#1f2937;--muted:#6b7280;--line:#e2e8f0;--bg:#eef1f8;--card:#fff;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:'Segoe UI',Arial,Helvetica,sans-serif;color:var(--ink);
    background:radial-gradient(120% 80% at 50% 0,#e8ebff 0,var(--bg) 60%);min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));}
  .wrap{width:100%;max-width:380px;text-align:center;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 24px;
    box-shadow:0 6px 24px rgba(20,30,60,.08);}
  .app-icon{width:104px;height:104px;border-radius:24px;box-shadow:0 12px 30px rgba(30,30,80,.28);}
  h1{margin:16px 0 2px;font-size:25px;font-weight:800;color:var(--navy);letter-spacing:.2px;}
  .sub{margin:0 0 20px;color:var(--muted);font-size:14px;}
  .spin{width:26px;height:26px;margin:4px auto 12px;border:3px solid #d7dced;border-top-color:var(--indigo);
    border-radius:50%;animation:sp .8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none;}}
  .status{min-height:18px;font-size:13px;color:var(--muted);}
  .open{display:inline-block;margin-top:18px;color:var(--indigo);font-weight:800;font-size:15px;text-decoration:none;}
  .open:active{opacity:.7;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img class="app-icon" src="assets/ql-512.png" alt="Quick Look"/>
      <h1>Quick Look</h1>
      <div class="sub">MDH Stoma Care — fast patient lookup</div>
      <div class="spin" aria-hidden="true"></div>
      <div class="status" id="status">Opening the patient lookup…</div>
      <a class="open" id="open" href="index.html#lookup">Open Quick Look now →</a>
    </div>
  </div>
<script>
  // A dedicated, separate entry point for Quick Look. It forwards straight into
  // the clinic app's locked, read-only patient lookup (#lookup) so the search
  // and the record layout always match the live register — there is no second
  // copy of the logic to drift. replace() keeps this splash out of history, so
  // the phone's Back button leaves the site rather than the full clinic app.
  var TARGET = 'index.html#lookup';
  try {
    window.location.replace(TARGET);
  } catch (e) {
    // Fall back to a normal navigation if replace is blocked for any reason.
    window.location.href = TARGET;
  }
  // If we are still here a moment later (e.g. the app is slow to load), leave
  // the tap-through link visible and reassure the reader.
  setTimeout(function () {
    var s = document.getElementById('status');
    if (s) s.textContent = 'Taking longer than usual — tap below to open.';
  }, 2500);
</script>
</body>
</html>
